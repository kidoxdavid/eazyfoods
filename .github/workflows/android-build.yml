name: Build Android APK

on:
  push:
    tags:
      - 'android-v*'   # trigger by pushing a tag: git tag android-v1.0.0 && git push --tags
  workflow_dispatch:    # also allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build signed APK / AAB
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend-customer
        run: npm install --legacy-peer-deps

      - name: Build web app for Android
        working-directory: frontend-customer
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npx vite build --config vite.config.android.js --mode android

      - name: Sync Capacitor
        working-directory: frontend-customer
        env:
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: frontend-customer/android
        run: chmod +x gradlew

      # Restore or create a stable debug keystore BEFORE the build so the APK
      # is signed with the same key whose SHA-1 is registered in Google Cloud Console.
      - name: Restore or create debug keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Restored existing debug keystore from secret."
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo ""
            echo "========================================================"
            echo "NEW KEYSTORE — copy everything between the lines and"
            echo "save it as GitHub secret DEBUG_KEYSTORE_BASE64:"
            echo "========================================================"
            base64 -w 0 ~/.android/debug.keystore
            echo ""
            echo "========================================================"
          fi
          echo ""
          echo "SHA-1 to register in Google Cloud Console (Android OAuth client):"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      # ── Debug APK (unsigned, for quick device testing without keystore) ──
      - name: Build debug APK
        working-directory: frontend-customer/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eazyfoods-debug.apk
          path: frontend-customer/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release AAB (signed, for Google Play Store) ──
      # Only runs when keystore secrets are configured
      - name: Build release AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: frontend-customer/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/eazyfoods.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/eazyfoods.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eazyfoods-release.aab
          path: frontend-customer/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
