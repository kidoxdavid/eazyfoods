<!doctype html>
<html lang="en">
  <head>
    <script>
      // Capacitor WebView serves from https://localhost — set production API URL before any module loads
      if (window.location.origin === 'https://localhost' || window.location.origin === 'capacitor://localhost') {
        window.API_BASE_URL = 'https://eazyfoods-api.onrender.com/api/v1';
      }
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <script async type="text/javascript" src="https://secure.helcim.app/helcim-pay/services/start.js"></script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff6b35" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#ff6b35" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>eazyfoods - Authentic African Groceries</title>
    <style>
      /* Orange in status bar; use 44px fallback when safe-area is 0 so strip always shows on iOS */
      html {
        background: linear-gradient(to bottom, #ff6b35 0, #ff6b35 env(safe-area-inset-top, 44px), #f9fafb env(safe-area-inset-top, 44px));
        background-attachment: fixed;
      }
      body { margin: 0; background: transparent; }
      #status-bar-safe-area {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 44px);
        background: #ff6b35;
        z-index: 9999;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Orange strip fills status bar; 44px fallback when safe-area not reported (iOS Safari) -->
    <div id="status-bar-safe-area"></div>
    <div id="root"></div>
    <script>
      (function() {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.name = 'theme-color';
          document.head.appendChild(meta);
        }
        meta.content = '#ff6b35';
      })();
    </script>
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
