# One-click hosting blueprint (Render). A private DEMO with invented data and a mock payment provider: no real money moves.
databases:
  - name: eazyfoods-db
    databaseName: eazyfoods
    plan: free

services:
  - type: web
    name: eazyfoods
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run seed && npm -w apps/api run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: eazyfoods-db, property: connectionString }
      - key: NODE_ENV
        value: development        # demo only: allows the mock payment provider. Never use for a real launch.
      - key: PAYMENT_PROVIDER
        value: mock               # change to helcim (with the three HELCIM_ values below) to take real card payments through Helcim. See docs/PAYMENTS.md.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: HELCIM_API_TOKEN
        sync: false
      - key: HELCIM_WEBHOOK_VERIFIER
        sync: false
      - key: HELCIM_REFUND_IP
        sync: false
      - key: DEMO_ALWAYS_OPEN
        value: "1"
      - key: WEB_ORIGIN
        value: https://eazyfoods.ca
      - key: ADMIN_EMAILS
        sync: false              # your own email(s), comma-separated: made admin (full control) at start-up once the account exists
      - key: NODE_VERSION
        value: "22"
